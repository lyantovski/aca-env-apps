name: Check demo
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: pocket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/pocket_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/pocket_test
      - run: docker build -t pocket-tasks:ci .
      - name: Smoke test bundled PostgreSQL and API
        shell: bash
        run: |
          docker run -d --name pocket-ci -p 127.0.0.1:8080:8080 \
            -e NODE_ENV=development -e APP_URL=http://localhost:8080 \
            -e ENTRA_TENANT_ID=11111111-1111-4111-8111-111111111111 \
            -e ENTRA_CLIENT_ID=22222222-2222-4222-8222-222222222222 \
            -e ENTRA_CLIENT_SECRET=test-only-not-real \
            -e SESSION_SECRET=test-only-at-least-32-character-secret \
            pocket-tasks:ci
          trap 'docker logs pocket-ci; docker rm -f pocket-ci' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8080/health/ready; then
              curl -fsS http://localhost:8080/api/session
              exit 0
            fi
            sleep 2
          done
          exit 1
